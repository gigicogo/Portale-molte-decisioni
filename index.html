<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Un portale, molte decisioni</title>
<style>
:root{--bg:#F3F6FB;--card:#fff;--tx:#142445;--mut:#4a5876;--blu:#2563EB;--navy:#142445;--ok:#16866B;--or:#E99A28;--ko:#D94B4B;--gr:#5b6577;--bd:#d5deec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1730;--card:#17264a;--tx:#f3f6fb;--mut:#b8c4de;--bd:#2d3f6b}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.1;margin:.3em 0;letter-spacing:-.02em}h2{font-size:1.4rem;margin:.2em 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;margin:14px 0;animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
button,input{font:inherit}button{cursor:pointer;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:14px 16px;min-height:52px;text-align:left;width:100%;margin:6px 0}
button:focus-visible,input:focus-visible{outline:4px solid var(--or);outline-offset:2px}button:hover{border-color:var(--blu)}
.pri{background:var(--blu);color:#fff;border-color:var(--blu);font-weight:700;text-align:center;font-size:1.15rem}.sec{text-align:center;width:auto;display:inline-block}
.sel{border-color:var(--blu);box-shadow:0 0 0 3px var(--blu)}input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx)}
.bar{height:12px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blu);transition:width .4s}
.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;color:var(--mut);font-size:.95rem}
.tag{display:inline-block;border-radius:9px;padding:2px 10px;color:#fff;font-weight:700;font-size:.9rem}
.ok{color:var(--ok);font-weight:700}.no{color:var(--or);font-weight:700}.big{background:var(--navy);color:#fff;border-radius:16px;padding:16px;font-weight:700;text-align:center}
.twist{background:var(--navy);color:#fff}.twist h2{color:#E99A28;font-size:1.7rem;animation:pulse 1.2s 2}@keyframes pulse{50%{transform:scale(1.04)}}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cmp div{border-radius:12px;padding:10px;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{width:auto;flex:1;text-align:center;min-width:130px}
small,.note{color:var(--mut);font-size:.9rem}a{color:var(--blu)}.tm{font-size:2rem;font-variant-numeric:tabular-nums;font-weight:700}
/* Rifinitura estetica (logica invariata) */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#2563EB,#4C8FD6,#16866B);z-index:90}
body{-webkit-font-smoothing:antialiased;background-image:radial-gradient(900px 420px at 85% -10%,rgba(37,99,235,.07),transparent 70%),radial-gradient(700px 360px at -10% 10%,rgba(22,134,107,.05),transparent 70%);background-repeat:no-repeat;background-attachment:fixed}
.card{box-shadow:0 1px 2px rgba(20,36,69,.06),0 14px 36px -18px rgba(20,36,69,.2)}
h1{background:linear-gradient(115deg,var(--tx) 30%,var(--blu) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
button{transition:border-color .15s ease,box-shadow .15s ease,filter .15s ease,transform .15s ease}
button:hover{box-shadow:0 6px 16px -10px rgba(20,36,69,.35)}
.pri{box-shadow:0 2px 8px -2px rgba(37,99,235,.5),inset 0 1px 0 rgba(255,255,255,.15)}
.pri:hover{filter:brightness(1.07);box-shadow:0 6px 18px -6px rgba(37,99,235,.6),inset 0 1px 0 rgba(255,255,255,.15)}
.pri:active{transform:translateY(1px)}
.big{background:linear-gradient(135deg,#142445,#1d3a6e);box-shadow:0 10px 26px -14px rgba(20,36,69,.5)}
.twist{background:linear-gradient(135deg,#142445,#1d3a6e)}
.bar i{background:linear-gradient(90deg,#2563EB,#4C8FD6)}
.tag{box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 1px 3px rgba(0,0,0,.15)}
input{transition:border-color .15s ease,box-shadow .15s ease}
</style></head><body><main id="app"></main>
<script>
const CAT={R:["Possibile pratica vietata","STOP: potrebbe essere un utilizzo vietato.","#D94B4B","⛔"],A:["Possibile alto rischio","Servono verifiche e requisiti specifici.","#E99A28","⚠️"],B:["Trasparenza","Occorre verificare gli obblighi di informazione.","#2563EB","💬"],V:["Uso ordinario","Non emergono specifici obblighi di alto rischio per questa funzione.","#16866B","✅"],G:["Informazioni insufficienti","Serve capire meglio cosa fa il sistema.","#5b6577","❓"]};
const CASI=[
{t:"Lo sportello che risponde",ic:"💬",s:"Il Comune introduce un chatbot sul proprio sito. Il cittadino può chiedere orari degli sportelli, documenti necessari per una pratica e modalità di prenotazione. Il chatbot non decide nulla sulle richieste: fornisce soltanto informazioni.",c:"B",o:["Quanto costa il software al Comune?","Il cittadino capisce chiaramente che sta dialogando con un sistema di IA?","Il chatbot risponde abbastanza velocemente?"],q:1,
fb:"Il chatbot non decide se il cittadino abbia diritto a un servizio. Ma quando un sistema di IA interagisce direttamente con una persona, vanno verificati gli obblighi di informazione dell'AI Act, salvo che l'interazione con l'IA sia già evidente per il contesto. Una soluzione semplice: all'inizio della chat mostrare «Stai interagendo con un assistente virtuale basato su intelligenza artificiale». Verificare anche con il fornitore che il sistema sia progettato per informare l'utente.",r:"AI Act, art. 50, par. 1",ch:"RTD/referente IA, ICT, responsabile del servizio digitale.",m:"L'IA informa, non valuta il cittadino."},
{t:"Il sistema che smista le pratiche",ic:"🗂️",s:"Ogni giorno il Comune riceve molte richieste dal portale. Un sistema di IA legge l'oggetto delle domande, individua la tipologia e le inoltra all'ufficio competente. Non assegna priorità, non valuta le persone e non determina l'esito delle pratiche.",c:"V",o:["Il sistema si limita a smistare le pratiche oppure ne modifica priorità ed esiti?","Il Comune dispone di un sito moderno?","Il sistema sa anche tradurre i documenti?"],q:0,
fb:"Il sistema svolge un'attività organizzativa di smistamento. Sulla base delle informazioni fornite non emerge una funzione di valutazione dei diritti delle persone riconducibile ai casi di alto rischio. Restano da verificare protezione dei dati, sicurezza, correttezza dello smistamento e regole interne dell'ente.",r:"AI Act, art. 6 e Allegato III: da valutare rispetto alla funzione effettiva",ch:"RTD/referente IA, ICT, responsabile del procedimento interessato.",m:"Organizzare documenti non equivale a valutare persone."},
{t:"Chi ha diritto al contributo?",ic:"🧾",s:"Il Comune usa un sistema di IA per esaminare domande individuali di sostegno economico essenziale. Il software analizza reddito, composizione familiare e altri requisiti, produce un punteggio e suggerisce all'operatore quali richieste accogliere e quali respingere. Un funzionario esamina poi le proposte.",c:"A",o:["Il gestionale è disponibile anche nel fine settimana?","Il fornitore possiede un marchio di qualità?","Il punteggio influenza la valutazione del diritto al contributo?"],q:2,
fb:"Qui l'IA non si limita a gestire documenti: contribuisce alla valutazione dell'accesso a una prestazione essenziale. È una funzione che può essere classificata ad alto rischio ai sensi dell'Allegato III. Il fatto che un funzionario confermi poi la decisione non esclude automaticamente il sistema dalle regole sull'alto rischio. Serve una valutazione formale prima dell'uso.",r:"AI Act, art. 6 e Allegato III, punto 5(a)",ch:"Responsabile servizi sociali, RTD, DPO, ufficio legale, ICT.",m:"Quando l'IA influenza l'accesso a un diritto, la verifica diventa molto più importante."},
{tw:1,t:"Cambia una sola funzione",ic:"⚡",s:"Ricordi il sistema che smistava le pratiche? Il fornitore propone una nuova versione. Ora il software analizza i dati economici e familiari dei richiedenti un sostegno pubblico essenziale, assegna un punteggio di urgenza e determina l'ordine di esame delle domande. Nei periodi di molte richieste, le domande con punteggio basso attendono più a lungo e questo può ritardare concretamente l'accesso al beneficio.",c:"A",o:["Tutti i documenti sono in PDF?","La priorità attribuita dall'IA influisce concretamente sui tempi di accesso alla prestazione?","Il software è facile da installare?"],q:1,
fb:"La tecnologia può essere simile a quella del caso 2, ma ora il sistema non si limita a smistare: valuta caratteristiche delle persone e attribuisce priorità che possono incidere sull'accesso effettivo a una prestazione essenziale. Richiede un'attenta verifica della possibile classificazione ad alto rischio. Una funzione descritta come organizzativa o preparatoria non è automaticamente esclusa: va esaminata anche la deroga dell'art. 6, par. 3, che non opera se il sistema effettua profilazione di persone fisiche.",r:"AI Act, art. 6, par. 3, e Allegato III, punto 5(a)",ch:"Responsabile del servizio, RTD, DPO, ufficio legale, ICT.",m:"NON È CAMBIATO IL NOME DEL SOFTWARE. È CAMBIATO CIÒ CHE IL SOFTWARE DECIDE O INFLUENZA."},
{t:"Il fornitore misterioso",ic:"🔍",s:"Una società propone al Comune la piattaforma SmartComune AI. Nella brochure: «Grazie all'intelligenza artificiale, il sistema velocizza la gestione delle richieste di contributo e migliora l'efficienza degli uffici». Il fornitore non spiega se il sistema smista documenti, assegna priorità oppure valuta l'ammissibilità delle persone.",c:"G",o:["In quale città si trova la sede del fornitore?","Il programma dispone di una modalità scura?","Quali operazioni svolge concretamente l'IA e quali decisioni influenza?"],q:2,
fb:"Non ci sono informazioni sufficienti per classificare il sistema. Potrebbe essere organizzazione documentale oppure valutazione di persone e diritti. Prima di procedere si chiede al fornitore una descrizione precisa di funzioni, output e uso nel procedimento. In questi casi chiedere chiarimenti è la risposta più corretta.",r:"AI Act, art. 6 e Allegato III",ch:"RTD, responsabile del procedimento, ICT, ufficio acquisti e, secondo dati e funzione, DPO e ufficio legale.",m:"Non sempre la risposta giusta è un colore. A volte è una domanda."}];
const L="ABC";
let S;const $=document.getElementById("app");
const reset=()=>{S={v:"home",team:"",i:0,ph:"a",cat:null,q:null,who:"",ans:[],tr:false,show:false,help:false,tsec:720,run:false,rev:false}};reset();
const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tn=()=>S.team.trim()||"Squadra del Comune";
const pts=a=>(a.cat==CASI[a.i].c?1:0)+(a.q==CASI[a.i].q?1:0);
const tot=()=>S.ans.reduce((n,a)=>n+pts(a),0);
let tick;function timer(){clearInterval(tick);if(S.run)tick=setInterval(()=>{if(S.tsec>0){S.tsec--;const e=document.getElementById("tm");if(e)e.textContent=fmt()}else{S.run=false;clearInterval(tick);render()}},1000)}
const fmt=()=>String(Math.floor(S.tsec/60)).padStart(2,"0")+":"+String(S.tsec%60).padStart(2,"0");
const catBtn=(k,fn,sel,dis)=>`<button class="${sel?'sel':''}" ${dis?'disabled':''} onclick="${fn}" style="border-left:10px solid ${CAT[k][2]}"><b>${CAT[k][3]} ${CAT[k][0].toUpperCase()}</b><br><small>${CAT[k][1]}</small></button>`;
function catTag(k){return `<span class="tag" style="background:${CAT[k][2]}">${CAT[k][3]} ${CAT[k][0]}</span>`}
function trainerBar(){return `<div class="card"><div class="top"><b>Modalità formatore</b><span class="tm" id="tm">${fmt()}</span></div><div class="row"><button onclick="S.run=!S.run;timer();render()">${S.run?"Pausa":"Avvia"} timer</button><button onclick="S.run=false;S.tsec=720;timer();render()">Azzera timer</button><button onclick="S.i=Math.max(0,S.i-1);S.show=false;render()" ${S.i==0?'disabled':''}>← Caso precedente</button><button onclick="S.i=Math.min(4,S.i+1);S.show=false;render()" ${S.i==4?'disabled':''}>Caso successivo →</button><button onclick="S.show=!S.show;render()">${S.show?"Nascondi":"Mostra"} soluzione</button><button onclick="reset();timer();render()">Reset</button></div><small>Discussione in aula: presenta il caso → i gruppi discutono → chiedi la categoria → mostra la soluzione → commenta e prosegui. Nessun punteggio, nessun voto in tempo reale.</small></div>`}
function trainerCase(){const c=CASI[S.i];return trainerBar()+`<div class="card ${c.tw?'twist':''}"><div class="top"><span>Caso ${S.i+1} di 5</span></div>${c.tw?'<h2>ATTENZIONE: CAMBIA UNA SOLA FUNZIONE!</h2>':''}<h2>${c.ic} ${c.t}</h2><p>${c.s}</p>${S.show?`<hr><p>${catTag(c.c)}</p><p><b>Domanda decisiva:</b> ${L[c.q]}) ${c.o[c.q]}</p><p>${c.fb}</p><p><b>Riferimento:</b> ${c.r}<br><b>Coinvolgere:</b> ${c.ch}</p><div class="big">${c.m}</div>`:`<p class="note">Soluzione nascosta.</p>`}</div>`}
function render(){let h="";const v=S.v;
if(v=="home"){h=`<div class="card"><div style="font-size:3rem" aria-hidden="true">🏛️ 💻 🧾 👥</div><h1>UN PORTALE, MOLTE DECISIONI</h1><p><b>La stessa IA può informare, organizzare o influenzare i diritti. Sai riconoscere la differenza?</b></p><p>Il Comune di Borgonuovo (immaginario) vuole introdurre nuove funzionalità di intelligenza artificiale. Tu fai parte del gruppo incaricato di esaminarle. Per ogni proposta dovrai capire quale rischio o obbligo emerge, quale aspetto verificare e chi coinvolgere nell'ente.</p><p>Non devi essere un giurista. Devi imparare a fare le domande giuste.</p><label for="tn"><b>Nome della squadra</b> (facoltativo)</label><input id="tn" maxlength="40" value="${esc(S.team)}" oninput="S.team=this.value"><button class="pri" onclick="S.v='play';S.tr=false;render()">INIZIA LA SIMULAZIONE</button><p class="note">5 casi · circa 12 minuti</p><div class="row"><button class="sec" onclick="S.help=!S.help;render()">Come si gioca?</button><button class="sec" onclick="S.v='tr';S.tr=true;render()">Modalità formatore</button><button class="sec" onclick="S.v='src';render()">Fonti e note</button></div>${S.help?`<p>Per ogni caso: 1) scegli la valutazione preliminare; 2) scegli la verifica più rilevante e, se vuoi, annota chi coinvolgeresti; 3) leggi il feedback. Ogni caso vale 2 punti (max 10). Il punteggio appare dopo ogni caso, quindi confrontatevi prima di confermare.</p>`:''}</div>`}
else if(v=="tr"){h=`<p><button class="sec" onclick="S.v='home';S.run=false;timer();render()">← Torna all'inizio</button></p>`+trainerCase()}
else if(v=="src"){h=`<p><button class="sec" onclick="S.v='${S.ans.length==5?'end':'home'}';render()">← Indietro</button></p><div class="card"><h2>Fonti e note</h2><p>Regolamento (UE) 2024/1689 (AI Act), come modificato dal Regolamento (UE) 2026/1744 (Digital Omnibus), in vigore dal 27 luglio 2026.</p><ul><li>Art. 6: classificazione dei sistemi ad alto rischio</li><li>Allegato III, punto 5(a): valutazione dell'accesso a prestazioni e servizi pubblici essenziali</li><li>Art. 50: obblighi di trasparenza</li></ul><p><a href="https://ai-act-service-desk.ec.europa.eu/it/ai-act/article-6" target="_blank" rel="noopener">Articolo 6</a> · <a href="https://ai-act-service-desk.ec.europa.eu/it/ai-act/article-50" target="_blank" rel="noopener">Articolo 50</a> · <a href="https://ai-act-service-desk.ec.europa.eu/en/ai-act/annex-3" target="_blank" rel="noopener">Allegato III</a></p><p><b>Calendario:</b> con il Digital Omnibus gli obblighi per i sistemi ad alto rischio dell'Allegato III si applicano dal 2 dicembre 2027 (non più dal 2 agosto 2026). La simulazione verte sulla classificazione, non sulla scadenza.</p><p class="note">Simulazione didattica. Le risposte non costituiscono una classificazione giuridica definitiva. L'applicazione dell'AI Act richiede una valutazione del sistema, delle sue finalità e del contesto d'uso. Restano applicabili le altre norme pertinenti. Nessun dato lascia il tuo dispositivo.</p></div>`}
else if(v=="play"){const c=CASI[S.i];const done=S.ph=="c";
h=`<div class="card"><div class="top"><b>${esc(tn())}</b><span>Caso ${S.i+1} di 5</span><span>Punteggio: ${S.ans.length?tot():"—"}</span></div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="${S.i+(done?1:0)}"><i style="width:${(S.i+(done?1:0))*20}%"></i></div></div>
<div class="card ${c.tw?'twist':''}">${c.tw?'<h2>ATTENZIONE: CAMBIA UNA SOLA FUNZIONE!</h2>':''}<h2>${c.ic} Caso ${S.i+1} — ${c.t}</h2><p>${c.s}</p></div>`;
if(S.ph=="a"){h+=`<div class="card"><h2>Quale valutazione preliminare daresti?</h2>${Object.keys(CAT).map(k=>catBtn(k,`S.cat='${k}';render()`,S.cat==k)).join("")}<p class="note">Etichette didattiche operative: non sostituiscono la classificazione giuridica completa e non sono sempre mutuamente esclusive.</p><button class="pri" ${S.cat?'':'disabled'} onclick="S.ph='b';render()">CONFERMA</button></div>`}
else if(S.ph=="b"){h+=`<div class="card"><h2>Che cosa controlleresti prima di procedere?</h2>${c.o.map((t,i)=>`<button class="${S.q===i?'sel':''}" onclick="S.q=${i};render()"><b>${L[i]})</b> ${t}</button>`).join("")}<label for="w"><b>Chi coinvolgeresti nel Comune?</b> (facoltativo, non valutato)</label><input id="w" maxlength="160" value="${esc(S.who)}" oninput="S.who=this.value"><button class="pri" ${S.q!==null?'':'disabled'} onclick="S.ans.push({i:S.i,cat:S.cat,q:S.q,who:S.who});S.ph='c';render()">CONFERMA</button></div>`}
else{const a=S.ans[S.i];h+=`<div class="card"><p>${a.cat==c.c?'<span class="ok">Categoria in linea con la soluzione.</span>':'<span class="no">Attenzione: in questo caso conta un elemento che potresti non aver considerato.</span>'}</p><p><b>Categoria attesa:</b> ${catTag(c.c)}<br><b>Tua scelta:</b> ${catTag(a.cat)}</p><p><b>Domanda decisiva:</b> ${L[c.q]}) ${c.o[c.q]}<br>${a.q==c.q?'<span class="ok">Scelta corretta.</span>':`<span class="no">Tu avevi scelto ${L[a.q]}).</span>`}</p><p><b>Punti del caso: ${pts(a)}/2</b> · Totale: ${tot()}/10</p><p>${c.fb}</p><p><b>Riferimento:</b> ${c.r}<br><b>Verifica da fare:</b> ${c.o[c.q]}<br><b>Referenti:</b> ${c.ch}</p><div class="big">${c.m}</div><button class="pri" style="margin-top:12px" onclick="${S.i<4?"S.i++;S.ph='a';S.cat=null;S.q=null;S.who=''":"S.v='end'"};render()">${S.i<4?"PASSA AL CASO SUCCESSIVO":"VEDI IL RIEPILOGO"}</button></div>`}}
else if(v=="end"){const t=tot();const msg=t<=4?"Hai individuato alcuni elementi importanti. Rivediamo insieme le domande decisive.":t<=7?"Buon lavoro. Stai imparando a riconoscere quando serve una verifica approfondita.":"Ottimo ragionamento! Hai distinto bene le diverse funzioni dell'IA.";
h=`<div class="card"><h1 style="font-size:2rem">LA TUA SQUADRA HA COMPLETATO LA VALUTAZIONE!</h1><p><b>${esc(tn())}</b> — <span style="font-size:2rem;font-weight:800">${t}/10</span></p><p>${msg}</p>${S.ans.map(a=>{const c=CASI[a.i];return `<div class="card" style="margin:8px 0"><b>Caso ${a.i+1} — ${c.t}</b><br>Individuata: ${catTag(a.cat)} Attesa: ${catTag(c.c)}<br>Domanda decisiva: ${a.q==c.q?'<span class="ok">corretta</span>':'<span class="no">da rivedere ('+L[c.q]+')</span>'}${S.rev?`<p>${c.fb}</p><small>${c.r}</small>`:`<br><i>${c.m}</i>`}</div>`}).join("")}<div class="big">NON CHIEDERTI SOLTANTO QUALE IA STAI USANDO.<br>CHIEDITI:<br>1. Che cosa fa davvero?<br>2. Quali persone o diritti può influenzare?<br>3. Quali verifiche e responsabilità sono necessarie?</div><div class="row" style="margin-top:12px"><button onclick="S.rev=!S.rev;render()">RIVEDI LE RISPOSTE</button><button onclick="dl()">SCARICA IL RIEPILOGO</button><button onclick="reset();render()">RICOMINCIA</button></div><p><button class="sec" onclick="S.v='src';render()">Fonti e note</button></p></div>`}
$.innerHTML=(S.tr&&v=="tr")?h:h;
const f=document.querySelector("h1,h2");if(S._f!=v+S.i+S.ph){S._f=v+S.i+S.ph;window.scrollTo(0,0)}}
function dl(){const lines=["UN PORTALE, MOLTE DECISIONI — Riepilogo","Squadra: "+tn(),"Punteggio: "+tot()+"/10",""];S.ans.forEach(a=>{const c=CASI[a.i];lines.push("Caso "+(a.i+1)+" — "+c.t,"  Categoria scelta: "+CAT[a.cat][0]+" | attesa: "+CAT[c.c][0],"  Domanda scelta: "+L[a.q]+" | corretta: "+L[c.q]+") "+c.o[c.q],"  Punti: "+pts(a)+"/2","  Riferimento: "+c.r,"  Messaggio: "+c.m,"")});lines.push("Simulazione didattica: non costituisce classificazione giuridica definitiva.");const b=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"});const u=URL.createObjectURL(b);const l=document.createElement("a");l.href=u;l.download="riepilogo-ai-act.txt";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),500)}
render();
</script></body></html>
