// ---------------- Schermata di gioco ----------------
function PlayScreen({ teamName, onFinish }) {
  const [caseIndex, setCaseIndex] = useState(0);
  const [phase, setPhase] = useState("a");
  const [selCat, setSelCat] = useState(null);
  const [answers, setAnswers] = useState([]);
  const [score, setScore] = useState(0);

  const c = CASES[caseIndex];

  useEffect(() => {
    window.scrollTo(0, 0);
  }, [phase, caseIndex]);

  function chooseCategory(id) {
    setSelCat(id);
    setPhase("b");
  }

  function confirmQuestion(qIndex, who) {
    const catOk = selCat === c.correctCategory;
    const qOk = qIndex === c.correctQuestion;
    const punti = (catOk ? 1 : 0) + (qOk ? 1 : 0);
    const answer = { caseIndex, catId: selCat, qIndex, who, catOk, qOk, punti };
    setScore(score + punti);
    setAnswers(answers.concat([answer]));
    setPhase("c");
  }

  function nextCase() {
    if (caseIndex === CASES.length - 1) {
      onFinish(answers, score);
      return;
    }
    const next = caseIndex + 1;
    setCaseIndex(next);
    setSelCat(null);
    setPhase(CASES[next].twist ? "twist" : "a");
  }

  return (
    <div>
      {phase !== "twist" && (
        <PlayHeader teamName={teamName} caseIndex={caseIndex} total={CASES.length} score={score} completed={answers.length} />
      )}
      {phase === "twist" && <TwistScreen c={c} onContinue={() => setPhase("a")} />}
      {phase === "a" && <PhaseA c={c} onChoose={chooseCategory} />}
      {phase === "b" && <PhaseB c={c} onConfirm={confirmQuestion} />}
      {phase === "c" && (
        <section className="max-w-4xl mx-auto px-4 py-6 space-y-5" aria-label="Fase C: feedback">
          <h3 className="text-2xl sm:text-3xl font-extrabold text-[#142445]">Il punto sulla proposta</h3>
          <FeedbackCard c={c} answer={answers[caseIndex]} showAnswer />
          <button
            onClick={nextCase}
            className="w-full sm:w-auto px-10 py-4 rounded-xl bg-[#2563EB] text-white text-lg sm:text-xl font-bold shadow-md hover:bg-[#1e5cd0] transition-colors"
          >
            {caseIndex === CASES.length - 1 ? "VEDI IL RIEPILOGO FINALE" : "PASSA AL CASO SUCCESSIVO"}
          </button>
        </section>
      )}
    </div>
  );
}

// ---------------- ModalitÃÂ  formatore ----------------
function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

function SolutionPanel({ c }) {
  const attesa = catById(c.correctCategory);
  return (
    <div className="bg-white rounded-2xl shadow-md border-2 border-[#16866B] p-5 sm:p-7 space-y-4 anim-fade-up">
      <p className="text-sm font-bold tracking-widest text-[#16866B]">SOLUZIONE DEL CASO {c.id}</p>
      <p className="inline-flex items-center gap-2 rounded-full px-4 py-2 font-bold text-white text-lg" style={{ backgroundColor: attesa.colore }}>
        <CategoryIcon id={attesa.id} size={20} />
        {attesa.nome}
      </p>
      <p className="text-lg text-slate-700"><span className="font-semibold text-[#142445]">Domanda decisiva: </span>ÃÂ«{c.questions[c.correctQuestion]}ÃÂ»</p>
      <p className="text-lg text-slate-700 leading-relaxed"><span className="font-semibold text-[#142445]">Spiegazione: </span>{c.spiegazione}</p>
      <p className="text-lg text-slate-700"><span className="font-semibold text-[#142445]">La verifica da fare: </span>{c.verifica}</p>
      <p className="text-lg text-slate-700"><span className="font-semibold text-[#142445]">Riferimento normativo: </span>{c.riferimento}</p>
      <p className="text-lg text-slate-700"><span className="font-semibold text-[#142445]">Referenti da coinvolgere: </span>{c.referenti}</p>
      <div className="rounded-xl bg-[#F3F6FB] p-4 text-center">
        <p className="font-extrabold text-[#142445]">{c.messaggio}</p>
      </div>
      {c.id === 4 && <ComparisonBlock confronto={c.confronto} animate={false} />}
    </div>
  );
}

const DISCUSSION_STEPS = [
  { n: 1, titolo: "Il formatore presenta il caso", testo: "Proietta lo scenario e leggi ad alta voce la domanda: ÃÂ«Quale valutazione preliminare daresti?ÃÂ»" },
  { n: 2, titolo: "I gruppi discutono", testo: "Lascia 2Ã¢ÂÂ3 minuti di discussione. Ogni gruppo sceglie una delle cinque categorie. Il timer da 12 minuti puÃÂ² aiutare a gestire i tempi." },
  { n: 3, titolo: "Il formatore chiede la categoria scelta", testo: "Raccogli a mano alzata la categoria scelta da ciascun gruppo, senza svelare la soluzione." },
  { n: 4, titolo: "Viene mostrata la soluzione", testo: "Rivela la categoria attesa, la domanda decisiva e la spiegazione normativa." },
  { n: 5, titolo: "Il formatore commenta e procede", testo: "Commenta le scelte dei gruppi, evidenzia la domanda decisiva e passa al caso successivo." },
];

function TrainerScreen({ onExit }) {
  const [ci, setCi] = useState(0);
  const [showSol, setShowSol] = useState(false);
  const [discuss, setDiscuss] = useState(false);
  const [step, setStep] = useState(1);
  const [sec, setSec] = useState(720);
  const [running, setRunning] = useState(false);
  const c = CASES[ci];

  useEffect(() => {
    if (!running) return undefined;
    const t = setInterval(() => setSec((s) => (s > 0 ? s - 1 : 0)), 1000);
    return () => clearInterval(t);
  }, [running]);

  useEffect(() => {
    window.scrollTo(0, 0);
  }, [ci]);

  const timerColor = sec > 120 ? "#FFFFFF" : sec > 60 ? "#E99A28" : "#FF8A8A";

  function resetSim() {
    setCi(0);
    setShowSol(false);
    setStep(1);
    setSec(720);
    setRunning(false);
  }

  function goCase(delta) {
    const next = Math.min(CASES.length - 1, Math.max(0, ci + delta));
    setCi(next);
    setShowSol(false);
    setStep(1);
  }

  return (
    <div className="min-h-screen">
      <header className="bg-[#142445] text-white sticky top-0 z-20 shadow-lg">
        <div className="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center gap-x-5 gap-y-3">
          <span className="font-black tracking-wide bg-[#E99A28] text-[#142445] px-3 py-1 rounded-lg text-sm">MODALITÃÂ FORMATORE</span>
          <div className="flex items-center gap-2" aria-label={"Timer: " + formatTime(sec)}>
            <span className="font-mono text-2xl font-bold" style={{ color: timerColor }}>{formatTime(sec)}</span>
            <button onClick={() => setRunning(!running)} className="px-4 py-2 rounded-lg bg-[#2563EB] hover:bg-[#1e5cd0] font-bold text-sm transition-colors">{running ? "PAUSA" : "AVVIA"}</button>
            <button onClick={() => { setRunning(false); setSec(720); }} className="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 font-bold text-sm transition-colors">AZZERA</button>
          </div>
          <div className="flex-1" />
          <button onClick={resetSim} className="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 font-bold text-sm transition-colors">RIPRISTINA</button>
          <button onClick={onExit} className="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 font-bold text-sm transition-colors">ESCI</button>
        </div>
      </header>

      <section className="max-w-5xl mx-auto px-4 py-6 space-y-6">
        <div className="flex items-center justify-between gap-3 flex-wrap">
          <button onClick={() => goCase(-1)} disabled={ci === 0} className="px-5 py-3 rounded-xl border-2 border-slate-200 bg-white font-bold text-[#142445] hover:border-[#2563EB] disabled:opacity-40 disabled:cursor-not-allowed transition-colors">Ã¢ÂÂ CASO PRECEDENTE</button>
          <p className="font-bold text-slate-600">CASO {c.id} DI {CASES.length}</p>
          <button onClick={() => goCase(1)} disabled={ci === CASES.length - 1} className="px-5 py-3 rounded-xl border-2 border-slate-200 bg-white font-bold text-[#142445] hover:border-[#2563EB] disabled:opacity-40 disabled:cursor-not-allowed transition-colors">CASO SUCCESSIVO Ã¢ÂÂ</button>
        </div>

        <ScenarioCard c={c} />

        <div className="bg-white rounded-2xl shadow-md border border-slate-200 p-5 flex items-center justify-between gap-4 flex-wrap">
          <label htmlFor="discuss-toggle" className="font-bold text-[#142445] text-lg">Discussione in aula <span className="font-normal text-slate-500">(senza punteggio)</span></label>
          <input id="discuss-toggle" type="checkbox" checked={discuss} onChange={(e) => { setDiscuss(e.target.checked); setStep(1); }} className="w-6 h-6 accent-[#2563EB]" />
        </div>

        {!discuss && (
          <div className="space-y-4">
            <button onClick={() => setShowSol(!showSol)} className={"px-6 py-3 rounded-xl font-bold text-lg transition-colors " + (showSol ? "bg-[#142445] text-white hover:bg-[#1d3560]" : "bg-[#E99A28] text-white hover:bg-[#d1891f]")}>
              {showSol ? "NASCONDI LE SOLUZIONI" : "MOSTRA LE SOLUZIONI"}
            </button>
            {showSol && <SolutionPanel c={c} />}
          </div>
        )}

        {discuss && (
          <div className="space-y-4">
            <ol className="flex flex-wrap gap-2" aria-label="Passaggi della discussione">
              {DISCUSSION_STEPS.map((s) => (
                <li key={s.n} className={"px-3 py-1.5 rounded-full text-sm font-bold " + (s.n === step ? "bg-[#2563EB] text-white" : s.n < step ? "bg-[#16866B] text-white" : "bg-slate-200 text-slate-600")}>
                  {s.n}. {s.titolo}
                </li>
              ))}
            </ol>
            <div className="bg-white rounded-2xl shadow-md border border-slate-200 p-5 sm:p-7">
              <h3 className="text-xl font-extrabold text-[#142445]">Passaggio {step}: {DISCUSSION_STEPS[step - 1].titolo}</h3>
              <p className="mt-2 text-lg text-slate-700">{DISCUSSION_STEPS[step - 1].testo}</p>
              {step === 3 && (
                <div className="mt-4 grid gap-2">
                  {CATEGORIES.map((cat) => (
                    <div key={cat.id} className="flex items-center gap-3 rounded-xl border-2 border-slate-200 p-3">
                      <CategoryIcon id={cat.id} size={20} />
                      <span className="font-bold text-[#142445]">{cat.nome}</span>
                    </div>
                  ))}
                </div>
              )}
              {step === 4 && <div className="mt-4"><SolutionPanel c={c} /></div>}
              <div className="mt-5 flex gap-3 flex-wrap">
                <button onClick={() => setStep(Math.max(1, step - 1))} disabled={step === 1} className="px-5 py-3 rounded-xl border-2 border-slate-200 font-bold text-[#142445] hover:border-[#2563EB] disabled:opacity-40 transition-colors">INDIETRO</button>
                {step < 5 ? (
                  <button onClick={() => setStep(step + 1)} className="px-5 py-3 rounded-xl bg-[#2563EB] text-white font-bold hover:bg-[#1e5cd0] transition-colors">AVANTI</button>
                ) : (
                  <button onClick={() => goCase(1)} disabled={ci === CASES.length - 1} className="px-5 py-3 rounded-xl bg-[#16866B] text-white font-bold hover:bg-[#136f59] disabled:opacity-40 transition-colors">PASSA AL CASO SUCCESSIVO</button>
                )}
              </div>
            </div>
          </div>
        )}

        <p className="text-sm text-slate-500">In questa modalitÃÂ  non ÃÂ¨ previsto il punteggio. Le scelte raccolte dai gruppi restano nelle loro schede locali: non esistono votazioni in tempo reale condivise.</p>
      </section>
    </div>
  );
}

// ---------------- Download del riepilogo (file di testo) ----------------
function downloadSummary(teamName, answers, score) {
  const lines = [];
  lines.push("UN PORTALE, MOLTE DECISIONI Ã¢ÂÂ Laboratorio AI Act nella Pubblica Amministrazione");
  lines.push("Riepilogo della simulazione");
  lines.push("");
  lines.push("Squadra: " + teamName);
  lines.push("Punteggio: " + score + " su 10");
  lines.push("");
  CASES.forEach((c, i) => {
    const a = answers[i];
    lines.push("CASO " + c.id + " Ã¢ÂÂ " + c.title);
    lines.push("  Categoria individuata: " + catById(a.catId).nome);
    lines.push("  Categoria attesa: " + catById(c.correctCategory).nome + (a.catOk ? "" : " (non corrisponde)"));
    lines.push("  Domanda decisiva: " + (a.qOk ? "corretta" : "non individuata"));
    lines.push("  La domanda chiave era: " + c.questions[c.correctQuestion]);
    if (a.who && a.who.trim()) lines.push("  Coinvolti indicati dalla squadra: " + a.who.trim());
    lines.push("  Da ricordare: " + c.messaggio);
    lines.push("  Riferimento: " + c.riferimento);
    lines.push("");
  });
  lines.push("Le tre domande da portare a casa:");
  lines.push("  1. Che cosa fa davvero il sistema?");
  lines.push("  2. Quali persone o diritti puÃÂ² influenzare?");
  lines.push("  3. Quali verifiche e responsabilitÃÂ  sono necessarie?");
  lines.push("");
  lines.push("Fonti: Regolamento (UE) 2024/1689 (AI Act), articoli 6 e 50, Allegato III punto 5(a).");
  lines.push("https://ai-act-service-desk.ec.europa.eu/it/ai-act/article-6");
  lines.push("https://ai-act-service-desk.ec.europa.eu/en/ai-act/annex-3");
  lines.push("https://ai-act-service-desk.ec.europa.eu/it/ai-act/article-50");
  lines.push("");
  lines.push("Simulazione didattica. Le risposte non costituiscono una classificazione giuridica definitiva.");

  const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "riepilogo-simulazione-ai-act.txt";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

// ---------------- App principale ----------------
function App() {
  const [view, setView] = useState("home");
  const [teamName, setTeamName] = useState("Squadra del Comune");
  const [answers, setAnswers] = useState([]);
  const [score, setScore] = useState(0);
  const [trainerMode, setTrainerMode] = useState(false);

  return (
    <div className="min-h-screen bg-[#F3F6FB] text-[#142445]" style={{ fontFamily: 'system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' }}>
      <GlobalStyles />
      {view === "home" && (
        <HomeScreen
          onStart={(name) => { setTeamName(name); setAnswers([]); setScore(0); setView("play"); }}
          onSources={() => setView("sources")}
          trainerMode={trainerMode}
          setTrainerMode={setTrainerMode}
          onOpenTrainer={() => setView("trainer")}
        />
      )}
      {view === "play" && (
        <PlayScreen
          teamName={teamName}
          onFinish={(a, s) => { setAnswers(a); setScore(s); setView("summary"); }}
        />
      )}
      {view === "summary" && (
        <SummaryScreen
          teamName={teamName}
          answers={answers}
          score={score}
          onReview={() => setView("review")}
          onDownload={() => downloadSummary(teamName, answers, score)}
          onRestart={() => setView("home")}
        />
      )}
      {view === "review" && <ReviewScreen answers={answers} onBack={() => setView("summary")} />}
      {view === "sources" && <SourcesScreen onBack={() => setView("home")} />}
      {view === "trainer" && <TrainerScreen onExit={() => setView("home")} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
